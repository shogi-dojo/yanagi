inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"

Style/Documentation:
  Enabled: false

# Transliteration tables and test fixtures are naturally long and
# table-driven; keep the limits meaningful without fighting the data.
Metrics/MethodLength:
  Max: 25
  Exclude:
    - "test/**/*"
Metrics/AbcSize:
  Max: 30
  Exclude:
    - "test/**/*"
# The checker's pipeline (override, word list, dictionary, rule) reads best in one class.
Metrics/ClassLength:
  Max: 120
  Exclude:
    - "test/**/*"
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10

# The codebase quotes strings with double quotes throughout.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
