# Established Ukrainian exonyms (pre-empt regular phonetic transliteration)
---
とうきょう:
  romaji: "tokyo"
  cyrillic: "Токіо"
  note: "Standard Ukrainian geographical exonym"
きょうと:
  romaji: "kyoto"
  cyrillic: "Кіото"
  note: "Standard Ukrainian geographical exonym (pre-empts きょ -> кьо rule)"
おおさか:
  romaji: "osaka"
  cyrillic: "Осака"
  note: "Standard Ukrainian geographical exonym"
ろしあ:
  romaji: "roshia"
  cyrillic: "Росія"
  note: "Ukrainian exonym for Russia; keeps «Росія» from being read as a Japanese «Рошія»"
